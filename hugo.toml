baseURL = 'https://lephuduc.github.io/'
locale = 'en-US'
title = 'Le Phu Duc'
disableKinds = ['taxonomy', 'term']

[params]
  tagline = 'Classic & Respect'
  description = 'Personal site of Le Phu Duc'
  author = 'Le Phu Duc'
  recentPosts = 4
  portrait = 'images/avt.png'   # file in assets/

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 30
  [[menus.main]]
    name = 'Achievements'
    pageRef = '/achievements'
    weight = 40

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true                 # hands math to layouts/_markup/render-passthrough.html
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)']]
  [markup.highlight]
    noClasses = false       # colors are in assets/css/syntax.css
    style = 'github-dark'
    lineNos = false
